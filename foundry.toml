[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 10_000
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

[rpc_endpoints]
# Arc Testnet — Chain ID 5042002, native gas token is USDC (18 decimals at native layer)
arc_testnet = "https://rpc.testnet.arc.network"
# Arc Mainnet — Chain ID 5042, explorer https://arc.etherscan.io
arc_mainnet = "https://rpc.mainnet.arc.io"

[etherscan]
arc = { key = "${ETHERSCAN_API_KEY}", chain = 5042, url = "https://api.etherscan.io/v2/api?chainid=5042" }
